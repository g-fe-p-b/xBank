<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name=""viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de Conta - XBank Invest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <img src="logo.png" alt="Logo do XBank Invest" style="width: 150px; height: auto; margin-right: 20px;">
            <h1>XBank Invest - Plataforma Financeira</h1>
            <!--Botão ativador de menu mobile-->
            <button class="menu-btn" onclick="alternarMenu()">☰</button>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="forms.html" class="active">Abertura de Conta</a></li>
                <li><a href="tabela.html">Produtos Financeiros</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="card form-container">
            <h2>Cadastro de Perfil do Investidor</h2>
            <p style="margin-bottom: 20px; color: #666666;">Preencha os dados abaixo para criar sua conta de investimento.</p>
            <div id="mensagem-erro" style="display: none;"></div>
            <form action="#" method="post" onsubmit="validarFormulario(event)">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone de Contato:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="valor">Aporte Inicial Pretendido (R$):</label>
                    <input type="number" id="valor" name="valor" required>
                </div>

                <div class="form-group">
                    <label for="perfil">Perfil de Risco:</label>
                    <select id="perfil" name="perfil">
                        <option value="conservador">Conservador (Foco em Renda Fixa)</option>
                        <option value="moderado">Moderado (Equilíbrio com FIIs)</option>
                        <option value="arrojado">Arrojado (Ações e Criptomoedas)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações ou Objetivos:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" placeholder="Descreva suas metas de investimento."></textarea>
                </div>

                <button type="submit" class="btn btn-full">Enviar Cadastro</button>
            </form>
        </div>
        <div id="resultado-cadastro"></div>
    </main>
    <script src="script.js"></script>
    <footer>
        <p>&copy; 2026 XBank Invest Banco de Investimentos. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
